# Coolify deployment for httpSMS.
# In Coolify: Docker Compose build pack, compose file = /docker-compose.coolify.yml
# Domains: api -> https://api.wisdomgroupedu.com:8000, web -> https://sms.wisdomgroupedu.com:3000
# Postgres credentials are generated by Coolify (SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      ENV: local
      APP_NAME: ${APP_NAME:-httpSMS}
      APP_URL: ${APP_URL:-https://sms.wisdomgroupedu.com}
      APP_LOGO_URL: ${APP_LOGO_URL}
      APP_PORT: "8000"
      SWAGGER_HOST: ${SWAGGER_HOST:-api.wisdomgroupedu.com}
      USE_HTTP_LOGGER: "true"
      ENTITLEMENT_ENABLED: ${ENTITLEMENT_ENABLED:-false}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}

      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/httpsms
      DATABASE_URL_DEDICATED: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/httpsms
      REDIS_URL: redis://redis:6379

      EVENTS_QUEUE_TYPE: emulator
      EVENTS_QUEUE_NAME: events-local
      EVENTS_QUEUE_ENDPOINT: http://localhost:8000/v1/events
      EVENTS_QUEUE_USER_ID: ${EVENTS_QUEUE_USER_ID:?}
      EVENTS_QUEUE_USER_API_KEY: ${EVENTS_QUEUE_USER_API_KEY:?}

      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:?}

      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-httpSMS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@wisdomgroupedu.com}
      SMTP_USERNAME: ${SMTP_USERNAME:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}

      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}

  web:
    build:
      context: ./web
      args:
        API_BASE_URL: ${API_BASE_URL:-https://api.wisdomgroupedu.com}
        APP_URL: ${APP_URL:-https://sms.wisdomgroupedu.com}
        APP_NAME: ${APP_NAME:-httpSMS}
        APP_ENV: production
        APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-https://github.com/NdoleStudio/httpsms/releases/latest/download/HttpSms.apk}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:?}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:?}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:?}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:?}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID}
        CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY}
        PUSHER_KEY: ${PUSHER_KEY}
        PUSHER_CLUSTER: ${PUSHER_CLUSTER}
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres:
  redis:
